<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Meetless Design System · Preview</title>
<link rel="stylesheet" href="../tokens.css"/>
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);height:100%}
  body{font-family:var(--font-body);font-feature-settings:"cv01","ss03";-webkit-font-smoothing:antialiased;overflow:hidden}
  .topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--border-soft);background:color-mix(in oklch,var(--bg) 96%,transparent)}
  .mark{position:relative;width:18px;height:18px;border-radius:5px;background:var(--accent)}
  .mark::after{content:"";position:absolute;inset:5px;border-radius:2px;background:var(--bg)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:590;font-size:15px;letter-spacing:-.01em}
  .mono-xs{font-family:var(--font-mono);font-size:11.5px;color:var(--muted)}
  .side{width:260px;border-right:1px solid var(--border-soft);background:color-mix(in oklch,var(--bg) 60%,transparent);padding:16px 12px;overflow-y:auto}
  .side a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:6px;font-size:13px;color:var(--fg-2);text-decoration:none;text-align:left}
  .side a:hover{color:var(--fg);background:color-mix(in oklch,var(--fg) 5%,transparent)}
  .gh{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
  .area{flex:1;min-width:0;display:flex;overflow:hidden;background:var(--bg)}
  .area iframe{flex:1;height:100%;border:0;background:var(--bg)}
</style>
</head>
<body>
<div id="app" style="display:flex;flex-direction:column;height:100vh">
  <div class="topbar">
    <span class="brand"><span class="mark"></span>Meetless Design System</span>
    <div style="flex:1"></div>
    <span class="mono-xs">preview library</span>
  </div>
  <div style="display:flex;flex:1;min-height:0">
    <aside class="side" id="nav">
      <a href="app-surface.html" data-src="app-surface.html">Applied UI surface</a>
      <a href="provider-model-controls.html" data-src="provider-model-controls.html">Ask composer · model picker</a>
      <a href="colors-primary.html" data-src="colors-primary.html">Color</a>
      <a href="typography-specimens.html" data-src="typography-specimens.html">Typography</a>
      <a href="spacing-tokens.html" data-src="spacing-tokens.html">Spacing · Radius · Elevation</a>
      <a href="components-buttons.html" data-src="components-buttons.html">Components</a>
      <a href="brand-assets.html" data-src="brand-assets.html">Brand</a>
      <div class="gh">Package</div>
      <a href="../DESIGN.md" data-src="../DESIGN.md">DESIGN.md</a>
      <a href="../README.md" data-src="../README.md">README.md</a>
      <a href="../SKILL.md" data-src="../SKILL.md">SKILL.md</a>
      <a href="../ui_kits/app/index.html" data-src="../ui_kits/app/index.html">ui_kits/app</a>
      <a href="../examples/meetless-prototype.html" data-src="../examples/meetless-prototype.html">examples/ prototype</a>
    </aside>
    <section class="area"><iframe id="frame" src="app-surface.html" title="preview surface"></iframe></section>
  </div>
</div>
<script>
const links=document.querySelectorAll('#nav a');
links.forEach(a=>{a.addEventListener('click',(e)=>{e.preventDefault();const s=a.getAttribute('data-src');if(s)document.getElementById('frame').src=s;});});
</script>
</body>
</html>
