<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Preview · Applied UI surface</title>
<link rel="stylesheet" href="../tokens.css"/>
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{padding:26px;font-family:var(--font-body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1200px;margin:0 auto}
  h1{font-size:24px;font-weight:590;letter-spacing:-.015em;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  iframe{width:100%;height:760px;border:1px solid var(--border);border-radius:12px;background:var(--bg);display:block;box-shadow:var(--elev-raised)}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border-radius:6px;border:1px solid transparent;font-size:13px;font-weight:510;background:var(--accent);color:#fff;cursor:pointer}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .l{color:var(--accent-hover);font-size:13px}
  code{font-family:var(--font-mono);font-size:12px;color:var(--meta)}
</style>
</head>
<body class="ds">
<div class="wrap">
  <h1>Applied UI surface</h1>
  <p class="sub">The preserved source prototype loads live below — this is the full interaction evidence the system is built from. Run it to exercise Record → Process → Read → Ask → Evidence.</p>

  <div class="links">
    <button class="btn btn-primary" onclick="document.getElementById('frame').src='../examples/meetless-prototype.html'">Reload prototype</button>
    <span class="l">source: <code>examples/meetless-prototype.html</code></span>
  </div>
  <iframe id="frame" src="../examples/meetless-prototype.html" title="Meetless prototype"></iframe>
</div>
</body>
</html>
