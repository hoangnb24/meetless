<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kit · Companion pairing</title>
<link rel="stylesheet" href="../../tokens.css"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body class="base">
<div class="topbar"><div class="brand"><span class="mark"></span>Meetless</div><div style="flex:1"></div></div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg)">
  <div class="panel" style="max-width:500px">
    <h1>Connect a companion</h1>
    <div style="color:var(--muted);font-size:13.5px;line-height:1.6;max-width:44ch">One recommended path: paste the pairing link shown by <b>Meetless</b> on your desktop. It links this device securely through the encrypted relay.</div>
    <div class="field"><label>Pairing link</label><input class="input" placeholder="https://relay.meetless.dev/pair/…"/></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:6px"><button class="btn btn-primary btn-lg">Pair securely</button><button class="btn btn-ghost">Cancel</button></div>
    <div style="margin-top:16px;border-top:1px solid var(--border-soft);padding-top:12px">
      <div style="color:var(--muted);font-size:13px;margin-bottom:8px">Prefer a direct connection on your home network?</div>
      <button class="btn btn-secondary btn-sm">Set up Direct LAN</button>
    </div>
  </div>
</div>
</body>
</html>
