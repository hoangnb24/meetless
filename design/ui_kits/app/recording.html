<!doctype html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Kit · Recording strip + setup</title>
<link rel="stylesheet" href="../../tokens.css"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body class="base">
<div class="topbar">
  <div class="brand"><span class="mark"></span>Meetless</div>
  <span class="host-chip online"><span class="dot"></span><span class="t">Host online</span></span>
  <div style="flex:1"></div>
</div>
<div class="rec-strip"><span class="live-dot"></span><span class="rec-title">Recording · Product roadmap review</span><span class="rec-elapsed">00:14:22</span><button class="btn btn-primary">Pause</button><button class="btn btn-secondary">Stop</button></div>
<div style="flex:1;display:flex;min-height:0;background:var(--bg)">
  <section style="flex:1;display:flex;align-items:center;justify-content:center">
    <div class="panel" style="max-width:460px">
      <h1>Recording setup</h1>
      <div class="sub" style="color:var(--muted);font-size:13.5px;max-width:44ch;margin:0 0 14px">One action starts capture. Microphone and system audio are pre-selected.</div>
      <div class="field"><label>Meeting title</label><input class="input" placeholder="e.g. Design crit — weekly sync"/></div>
      <div style="margin-top:6px"><span class="proposed-tag">Proposed</span><span class="proposed-tag">Proposed</span></div>
    </div>
  </section>
</div>
</body>
</html>
